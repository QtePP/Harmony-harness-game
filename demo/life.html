<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>如果 · 小狮日记</title>
<style>
  :root {
    --paper: #f7efe0;
    --paper-2: #efe2cc;
    --ink: #211b15;
    --ink-2: #4d4438;
    --muted: #827463;
    --line: rgba(77, 68, 56, 0.18);
    --red: #982d24;
    --red-2: #7b1f1a;
    --gold: #b28a4e;
    --gold-2: #d9b77e;
    --green: #2f6b4f;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: #17130f;
    background-image:
      radial-gradient(circle at 50% -10%, rgba(178, 138, 78, 0.16), transparent 46%),
      radial-gradient(circle at 50% 110%, rgba(152, 45, 36, 0.13), transparent 48%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #1d1813, #0e0b08);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--gold-2);
    outline-offset: 3px;
  }

  #app { min-height: 100vh; }

  .table {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
  }

  /* ---------- 卡体 ---------- */
  .card {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 4 / 6;
    overflow: hidden;
    border-radius: 15px;
    background:
      radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.55), transparent 38%),
      linear-gradient(160deg, #fcf8ee, var(--paper-2));
    color: var(--ink);
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(178, 138, 78, 0.5),
      inset 0 0 0 1px rgba(255, 255, 255, 0.55);
    animation: cardIn 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(152, 45, 36, 0.2);
    border-radius: 10px;
    pointer-events: none;
    z-index: 2;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(77, 68, 56, 0.022) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 85% 90%, rgba(178, 138, 78, 0.1), transparent 32%);
    pointer-events: none;
    z-index: 1;
  }

  .card-grid {
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: auto auto auto minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 6px 8px;
    height: 100%;
    padding: 18px 17px 15px;
  }

  .card-head { grid-column: 1 / 4; grid-row: 1; min-width: 0; }
  .card-seal {
    grid-column: 4;
    grid-row: 1;
    justify-self: end;
    align-self: start;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 4px;
    background: var(--red);
    color: #fbeee0;
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1;
    box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.15), 0 4px 10px rgba(152, 45, 36, 0.25);
  }

  .act {
    margin: 0 0 3px;
    font-size: 8px;
    letter-spacing: 0.16em;
    color: var(--red);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress { color: var(--muted); letter-spacing: 0.04em; }

  .card-head h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    grid-column: 1 / 5;
    grid-row: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: baseline;
    font-size: 9px;
    line-height: 1.35;
    color: var(--muted);
    letter-spacing: 0.05em;
    min-width: 0;
  }
  .card-meta span + span::before {
    content: "·";
    margin-right: 8px;
    color: rgba(130, 116, 99, 0.5);
  }

  /* ---------- 数值 ---------- */
  .card-stats {
    grid-column: 1 / 5;
    grid-row: 3;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
  }
  .card-stats.life { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .chip {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 3px;
    padding: 3px 4px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(255, 253, 247, 0.58);
    font-size: 9px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
  }
  .chip b {
    font-weight: 500;
    font-size: 7px;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .chip.warn { border-color: rgba(178, 138, 78, 0.48); color: #765728; }
  .chip.danger { border-color: rgba(152, 45, 36, 0.45); color: var(--red); }

  /* ---------- 叙述 ---------- */
  .card-story {
    grid-column: 1 / 5;
    grid-row: 4 / 6;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: auto;
    padding-right: 2px;
    scrollbar-width: none;
  }
  .card-story::after {
    content: "生";
    position: absolute;
    right: -4px;
    bottom: -14px;
    font-family: var(--serif);
    font-size: 92px;
    line-height: 1;
    color: rgba(152, 45, 36, 0.045);
    pointer-events: none;
    user-select: none;
  }
  .card-story::-webkit-scrollbar { display: none; }

  .narration {
    margin: 0 0 7px;
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.72;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .timeskip {
    margin: 0 0 5px;
    font-family: var(--serif);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--gold);
  }

  .deltas { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 7px; }
  .delta {
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 8px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .delta.up { color: var(--green); background: rgba(47, 107, 79, 0.08); }
  .delta.down { color: var(--red); background: rgba(152, 45, 36, 0.07); }

  .history {
    margin-top: 4px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    font-size: 9px;
    line-height: 1.65;
    color: var(--muted);
  }
  .history summary { cursor: pointer; letter-spacing: 0.1em; color: var(--gold); }
  .history p { margin: 5px 0 0; font-family: var(--serif); }

  .hint {
    margin: 2px 0 0;
    font-size: 8.5px;
    line-height: 1.6;
    color: var(--muted);
  }
  .muted { color: var(--muted); }

  /* ---------- 动作 ---------- */
  .card-actions {
    grid-column: 1 / 5;
    grid-row: 6;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }

  .choice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    min-height: 29px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(255, 253, 247, 0.72);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 12.5px;
    line-height: 1.3;
    text-align: left;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .choice:hover { border-color: rgba(152, 45, 36, 0.42); background: #fffdf8; }
  .choice .arrow { color: var(--red); font-family: var(--serif); font-size: 15px; line-height: 1; opacity: 0.55; }
  .choice-text { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .desire {
    flex: 0 0 auto;
    padding: 0 4px;
    border: 1px solid rgba(178, 138, 78, 0.4);
    border-radius: 3px;
    color: var(--gold);
    font-family: var(--sans);
    font-size: 7.5px;
    line-height: 1.5;
    letter-spacing: 0.04em;
  }
  .flag {
    flex: 0 0 auto;
    margin-left: 3px;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 7.5px;
    line-height: 1.5;
    letter-spacing: 0.03em;
  }
  .choice.compact { min-height: 25px; padding: 3px 8px; font-size: 11.5px; }
  .card-actions.many .choice { min-height: 22px; padding: 2px 7px; font-size: 11px; }
  .card-actions.many { gap: 3px; }

  .primary, .secondary {
    width: 100%;
    min-height: 32px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  .primary { border: 0; background: var(--red); color: #fff8ee; }
  .primary:hover { background: #b03a30; }
  .primary:active, .secondary:active { transform: scale(0.985); }
  .secondary { border: 1px solid var(--line); background: rgba(255, 253, 247, 0.6); color: var(--ink-2); }

  .check-line {
    margin: 0;
    font-family: var(--serif);
    font-size: 11.5px;
    letter-spacing: 0.02em;
  }
  .check-hint { margin: 0 0 4px; font-size: 8.5px; line-height: 1.5; color: var(--muted); }

  .ending-actions { flex-direction: row; }
  .ending-actions .primary, .ending-actions .secondary { flex: 1; }

  /* ---------- 卡背 ---------- */
  .card.back {
    background:
      radial-gradient(circle at 50% 20%, rgba(255, 228, 190, 0.09), transparent 42%),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 7px),
      linear-gradient(160deg, #7d211a, #54130f);
    color: #f7ead2;
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(217, 183, 126, 0.62),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .card.back::before { border-color: rgba(217, 183, 126, 0.38); }
  .card.back::after {
    background-image:
      radial-gradient(circle at 50% 50%, transparent 48%, rgba(0, 0, 0, 0.16) 100%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 5px);
  }

  .back-inner {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 26px 24px;
  }

  .back-seal {
    width: 70px;
    height: 70px;
    display: grid;
    place-items: center;
    border: 2px solid var(--gold-2);
    border-radius: 7px;
    color: var(--gold-2);
    font-family: var(--serif);
    font-size: 40px;
    line-height: 1;
    box-shadow: inset 0 0 0 4px rgba(217, 183, 126, 0.07);
    animation: stamp 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .back-kicker {
    margin: 20px 0 8px;
    font-size: 8.5px;
    letter-spacing: 0.28em;
    color: #d9b98d;
    text-transform: uppercase;
  }

  .back-title {
    margin: 0;
    font-family: var(--serif);
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: #f9ecd6;
  }

  .back-sub {
    margin: 12px 0 0;
    font-family: var(--serif);
    font-size: 10.5px;
    line-height: 1.9;
    letter-spacing: 0.05em;
    color: #d9b98d;
  }

  .back-memory {
    margin: 10px 0 0;
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1.8;
    letter-spacing: 0.02em;
    color: #bfa477;
  }

  .premise-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    max-width: 240px;
    margin-top: 14px;
    text-align: left;
  }
  .premise-field span {
    font-size: 8px;
    letter-spacing: 0.12em;
    color: #c9a878;
  }
  .premise-field input {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid rgba(217, 183, 126, 0.35);
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.18);
    color: #f3e3c9;
    font-family: var(--serif);
    font-size: 11px;
  }
  .premise-field input::placeholder { color: #8f7758; }
  .premise-field input:focus { outline: 2px solid rgba(217, 183, 126, 0.55); outline-offset: 1px; }

  .back-actions {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 100%;
    max-width: 210px;
    margin-top: 26px;
  }

  .gold {
    width: 100%;
    min-height: 36px;
    border: 0;
    border-radius: 999px;
    background: var(--gold-2);
    color: #3b2117;
    font-size: 13px;
    letter-spacing: 0.06em;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
  }
  .gold:hover { background: #e6c993; }

  .ghost-light {
    width: 100%;
    min-height: 32px;
    border: 1px solid rgba(217, 183, 126, 0.45);
    border-radius: 999px;
    background: transparent;
    color: #f3e3c9;
    font-size: 12px;
  }
  .ghost-light:hover { background: rgba(217, 183, 126, 0.1); }

  .link-light {
    border: 0;
    background: transparent;
    color: #c9a878;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    padding: 4px;
  }
  .link-light:hover { color: #e6c993; }

  .back-foot {
    margin: 22px 0 0;
    font-size: 8px;
    letter-spacing: 0.16em;
    color: #b08d64;
  }

  /* ---------- 结局卡 ---------- */
  .card.ending-card {
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.62),
      0 0 0 1px rgba(178, 138, 78, 0.75),
      inset 0 0 0 1px rgba(255, 255, 255, 0.5);
  }
  .ending-card .card-head h1 { font-size: 30px; }
  .ending-text { font-size: 12.8px; line-height: 1.75; }
  .ending-comment {
    margin: 6px 0 0;
    font-family: var(--serif);
    font-size: 10px;
    line-height: 1.65;
    color: var(--gold);
  }
  .ending-run {
    margin: 7px 0 0;
    font-size: 8.5px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .all-done { margin: 5px 0 0; font-size: 8.5px; letter-spacing: 0.14em; color: var(--gold); }

  /* ---------- 卡外工具 ---------- */
  .tools {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 12px;
    color: #bfa987;
    font-size: 10px;
  }
  .tools button {
    border: 0;
    background: transparent;
    color: #d7c3a1;
    font-size: 10px;
    padding: 4px 5px;
    border-radius: 4px;
  }
  .tools button:hover { color: #f2dfbf; background: rgba(217, 183, 126, 0.08); }
  .persona { display: inline-flex; align-items: center; gap: 4px; color: #9d8a6f; }
  .persona select {
    border: 1px solid rgba(217, 183, 126, 0.32);
    border-radius: 4px;
    background: #241c14;
    color: #e2cfaf;
    font-size: 10px;
    padding: 3px 4px;
  }
  .note {
    margin: 0;
    font-size: 8px;
    letter-spacing: 0.14em;
    color: #7c6a53;
  }

  /* ---------- 图鉴 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(8, 6, 4, 0.72);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    animation: fade 0.18s ease both;
  }
  .modal {
    width: min(100%, 680px);
    max-height: min(86vh, 860px);
    overflow: auto;
    padding: 20px;
    border: 1px solid rgba(178, 138, 78, 0.4);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    animation: cardIn 0.25s ease both;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    margin: 0 0 5px;
    font-size: 8px;
    letter-spacing: 0.16em;
    color: var(--red);
    text-transform: uppercase;
  }
  .modal-head h2 { margin: 0; font-family: var(--serif); font-size: 26px; font-variant-numeric: tabular-nums; }
  .close { border: 0; background: transparent; color: var(--muted); font-size: 23px; line-height: 1; padding: 3px 8px; border-radius: 6px; }
  .close:hover { background: rgba(77, 68, 56, 0.07); }
  .gallery { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
  .gallery-card {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 253, 247, 0.55);
  }
  .gallery-card.locked { opacity: 0.62; }
  .gallery-card summary {
    display: flex;
    align-items: baseline;
    gap: 9px;
    cursor: pointer;
    list-style: none;
  }
  .gallery-card summary::-webkit-details-marker { display: none; }
  .gallery-card.open summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--muted);
    font-size: 10px;
    transition: transform 0.12s ease;
  }
  .gallery-card.open[open] summary::after { transform: rotate(180deg); }
  .gallery-index { font-size: 8px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .gallery-title { font-family: var(--serif); font-size: 15px; letter-spacing: 0.05em; color: var(--ink); flex: 0 0 auto; }
  .gallery-sub { font-family: var(--serif); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gallery-hint { margin: 2px 0 0; font-size: 9px; color: var(--muted); }
  .gallery-text { margin: 10px 0 0; font-family: var(--serif); font-size: 12px; line-height: 1.8; color: var(--ink-2); }
  .gallery-comment { margin: 6px 0 0; font-size: 9px; color: var(--gold); }
  .modal-foot { margin: 14px 0 0; font-size: 8.5px; color: var(--muted); line-height: 1.6; }

  /* ---------- 年代 / 锁 / 复利 ---------- */
  .era {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px;
    margin: 0 0 6px;
    font-size: 7.5px;
    line-height: 1.4;
  }
  .era-source {
    color: var(--red);
    letter-spacing: 0.08em;
  }
  .era-item {
    padding: 1px 4px;
    border: 1px solid rgba(178, 138, 78, 0.32);
    border-radius: 3px;
    background: rgba(178, 138, 78, 0.06);
    color: var(--gold);
    white-space: nowrap;
  }

  .premise-meta { color: var(--red); }
  .premise-line {
    margin: 6px 0 0;
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1.6;
    color: var(--red);
  }

  .locked-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin: 7px 0 0;
    padding: 5px 7px;
    border: 1px dashed rgba(178, 138, 78, 0.42);
    border-radius: 5px;
    background: rgba(178, 138, 78, 0.05);
    color: var(--gold);
    font-family: var(--serif);
    font-size: 9px;
    letter-spacing: 0.04em;
    text-align: left;
  }
  .locked-link span { font-size: 13px; line-height: 1; }
  .locked-link:hover { background: rgba(178, 138, 78, 0.1); }

  .locked-card {
    margin-top: 9px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(255, 253, 247, 0.55);
  }
  .locked-label {
    margin: 0;
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-2);
    text-decoration: line-through;
    text-decoration-color: rgba(77, 68, 56, 0.35);
  }
  .locked-reason {
    margin: 3px 0 0;
    font-size: 9px;
    line-height: 1.55;
    color: var(--muted);
  }

  .memory-note {
    margin: 0 0 7px;
    padding: 6px 7px;
    border-left: 2px solid rgba(178, 138, 78, 0.4);
    background: rgba(255, 253, 247, 0.4);
    font-family: var(--serif);
    font-size: 8.5px;
    line-height: 1.7;
    color: var(--ink-2);
  }
  .memory-note p { margin: 0; }

  .trace {
    margin-top: 7px;
    padding-top: 5px;
    border-top: 1px dashed rgba(77, 68, 56, 0.18);
    font-size: 8px;
    line-height: 1.55;
    color: var(--muted);
  }
  .trace-title {
    margin: 0 0 2px;
    font-family: var(--sans);
    font-size: 7px;
    letter-spacing: 0.12em;
    color: var(--gold);
  }
  .trace p {
    margin: 1px 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--serif);
  }
  .trace p span {
    margin-right: 5px;
    color: var(--gold);
    font-family: var(--sans);
    font-size: 7px;
  }

  .journey {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1px;
    margin-top: auto;
    padding-top: 7px;
    border-top: 1px solid var(--line);
  }
  .journey-step {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 6.5px;
    line-height: 1;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .journey-step i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(77, 68, 56, 0.22);
  }
  .journey-step.done i { background: var(--gold); }
  .journey-step.done b { color: var(--gold); }
  .journey-step.now i {
    width: 6px;
    height: 6px;
    background: var(--red);
    box-shadow: 0 0 0 2px rgba(152, 45, 36, 0.12);
  }
  .journey-step.now b { color: var(--red); }
  .journey-step b { font-weight: 400; }

  .compound {
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .echo {
    margin: 6px 0 0;
    padding-left: 7px;
    border-left: 2px solid rgba(178, 138, 78, 0.55);
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1.65;
    color: var(--ink-2);
  }
  .echo span {
    display: block;
    font-family: var(--sans);
    font-size: 7px;
    letter-spacing: 0.12em;
    color: var(--gold);
  }

  .decision {
    margin: 7px 0 0;
    padding: 5px 7px;
    border-left: 2px solid rgba(47, 107, 79, 0.55);
    background: rgba(47, 107, 79, 0.06);
    font-size: 8.5px;
    line-height: 1.55;
    color: var(--ink-2);
  }
  .decision b {
    display: block;
    margin-bottom: 2px;
    font-family: var(--sans);
    font-size: 7px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--green);
  }

  /* ---------- 拷问卡 ---------- */
  .card.question-card {
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.6), transparent 42%),
      linear-gradient(160deg, #fbf6ea, #eadcc4);
  }
  .question-text {
    font-size: 15px;
    line-height: 1.85;
  }
  .question-actions .choice {
    border-color: rgba(152, 45, 36, 0.24);
    background: rgba(255, 252, 244, 0.8);
  }

  /* ---------- 开放式尾声 ---------- */
  .open-epilogue {
    margin-top: 8px;
    padding: 7px 8px;
    border: 1px dashed rgba(178, 138, 78, 0.45);
    border-radius: 4px;
    background: rgba(255, 253, 247, 0.5);
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1.7;
    color: var(--ink-2);
  }
  .open-epilogue p { margin: 0; }
  .open-title {
    margin-bottom: 3px !important;
    font-family: var(--sans);
    font-size: 7px;
    letter-spacing: 0.14em;
    color: var(--red);
  }
  .open-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 7px;
    margin-top: 5px;
    font-family: var(--sans);
    font-size: 7.5px;
    color: var(--muted);
  }
  .open-tags span + span::before {
    content: "·";
    margin-right: 7px;
    color: rgba(130, 116, 99, 0.5);
  }

  .lastline {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    margin-top: 9px;
  }
  .lastline label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    font-size: 7.5px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .lastline input {
    width: 100%;
    min-width: 0;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(255, 253, 247, 0.7);
    font-family: var(--serif);
    font-size: 10px;
    color: var(--ink);
  }
  .lastline .secondary {
    width: auto;
    flex: 0 0 auto;
    min-height: 26px;
    padding: 4px 9px;
    font-size: 9px;
  }
  .lastline-show {
    margin: 5px 0 0;
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1.6;
    color: var(--red);
  }

  .modal-sub {
    margin: 3px 0 0;
    font-size: 9px;
    line-height: 1.55;
    color: var(--muted);
  }
  .group-title {
    margin: 16px 0 6px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--line);
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--red);
  }

  /* ---------- 动效 ---------- */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.988); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes stamp {
    from { opacity: 0; transform: scale(1.3) rotate(-4deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 380px) {
    .card { width: min(94vw, 360px); }
    .card-grid { padding: 15px 14px 13px; gap: 5px 7px; }
    .card-head h1 { font-size: 22px; }
    .narration { font-size: 12.2px; line-height: 1.66; }
    .choice { font-size: 11.6px; }
    .card-actions.many .choice { min-height: 21px; font-size: 10.7px; }
    .back-title { font-size: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
