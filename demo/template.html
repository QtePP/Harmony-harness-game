<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>三国人生 · 离线 demo</title>
<style>
  :root {
    --paper: #f2eadb;
    --paper-2: #e9dfcc;
    --card: rgba(255, 253, 247, 0.78);
    --ink: #211c16;
    --ink-2: #4a4238;
    --muted: #807567;
    --line: rgba(74, 66, 56, 0.18);
    --accent: #9b2c24;
    --accent-2: #b4453a;
    --gold: #a8864f;
    --green: #2f6b4f;
    --shadow: 0 18px 50px rgba(62, 48, 32, 0.12);
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    font-family: var(--sans);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255, 255, 255, 0.65), transparent 38%),
      radial-gradient(circle at 100% 20%, rgba(155, 44, 36, 0.06), transparent 34%),
      repeating-linear-gradient(0deg, rgba(74, 66, 56, 0.028) 0 1px, transparent 1px 4px),
      linear-gradient(160deg, var(--paper), var(--paper-2));
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  #app {
    width: min(100%, 760px);
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 18px max(56px, env(safe-area-inset-bottom));
  }

  /* ---------- 顶栏 ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0 20px;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .seal {
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 4px;
    background: var(--accent);
    color: #f9efe2;
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1;
    box-shadow: inset 0 0 0 2px rgba(255, 245, 230, 0.18), 0 4px 12px rgba(155, 44, 36, 0.28);
    flex: 0 0 auto;
  }

  .top-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }

  .ghost {
    border: 0;
    background: transparent;
    color: var(--ink-2);
    font-size: 12px;
    padding: 8px 8px;
    border-radius: 8px;
  }
  .ghost:hover { background: rgba(74, 66, 56, 0.07); }
  .ghost .count { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- 开场 ---------- */
  .hero {
    min-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 36px 0 48px;
  }

  .hero-seal {
    width: 92px;
    height: 92px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: var(--accent);
    color: #fbeee0;
    font-family: var(--serif);
    font-size: 54px;
    line-height: 1;
    box-shadow: inset 0 0 0 3px rgba(255, 245, 230, 0.16), 0 20px 50px rgba(155, 44, 36, 0.26);
    animation: stamp 0.6s cubic-bezier(0.2, 0.9, 0.2, 1) both;
  }

  .kicker {
    margin: 28px 0 8px;
    font-size: 11px;
    letter-spacing: 0.24em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .hero h1, .ending h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
  }
  .hero h1 { font-size: clamp(42px, 11vw, 64px); }

  .tagline {
    margin: 22px 0 0;
    font-family: var(--serif);
    font-size: clamp(17px, 4.4vw, 21px);
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }

  .lede {
    max-width: 30em;
    margin: 18px auto 0;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.95;
    color: var(--muted);
    text-align: center;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 34px;
  }

  .primary, .secondary, .text {
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 14px;
    letter-spacing: 0.04em;
    transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
  }
  .primary {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff8ee;
    box-shadow: 0 10px 26px rgba(155, 44, 36, 0.22);
  }
  .primary:hover { background: var(--accent-2); }
  .primary:active, .secondary:active, .text:active { transform: scale(0.98); }

  .secondary {
    border: 1px solid var(--line);
    background: rgba(255, 253, 247, 0.55);
    color: var(--ink-2);
  }
  .secondary:hover { border-color: rgba(155, 44, 36, 0.35); }

  .text {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding-left: 12px;
    padding-right: 12px;
  }
  .text:hover { color: var(--accent); }
  .text.active { color: var(--accent); }

  .wide { width: 100%; margin-top: 20px; }

  .footnote {
    margin: 44px 0 0;
    font-size: 10.5px;
    line-height: 1.8;
    color: rgba(128, 117, 103, 0.85);
    letter-spacing: 0.03em;
  }

  /* ---------- 场景 ---------- */
  .stage { animation: rise 0.32s ease both; }

  .meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .meta span + span::before {
    content: "·";
    margin-right: 12px;
    color: var(--line);
  }

  .timeskip {
    margin: 16px 0 0;
    font-family: var(--serif);
    font-size: 12.5px;
    color: var(--gold);
    letter-spacing: 0.12em;
  }

  .scene { padding: 26px 0 6px; }

  .act {
    margin: 0 0 10px;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .progress { color: var(--muted); letter-spacing: 0.08em; }

  .scene h2 {
    margin: 0 0 18px;
    font-family: var(--serif);
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.3;
  }

  .narration {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(16.5px, 4.3vw, 18.5px);
    line-height: 1.95;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  /* ---------- 数值 ---------- */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 24px 0 22px;
  }

  .chip {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(255, 253, 247, 0.55);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }
  .chip b {
    font-weight: 500;
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .chip.warn { border-color: rgba(168, 134, 79, 0.5); color: #7b5c2e; }
  .chip.danger { border-color: rgba(155, 44, 36, 0.45); color: var(--accent); }

  /* ---------- 选项 ---------- */
  .choices { display: flex; flex-direction: column; gap: 9px; }

  .choice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
    padding: 15px 17px;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 2px 0 rgba(74, 66, 56, 0.03);
    transition: border-color 0.14s ease, background 0.14s ease, transform 0.14s ease;
  }
  .choice:hover {
    border-color: rgba(155, 44, 36, 0.42);
    background: #fffdf8;
  }
  .choice:active { transform: translateY(1px); }

  .choice-label {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.5;
    letter-spacing: 0.03em;
  }
  .choice-arrow {
    color: var(--accent);
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1;
    opacity: 0.55;
    transition: transform 0.14s ease, opacity 0.14s ease;
  }
  .choice:hover .choice-arrow { transform: translateX(3px); opacity: 1; }

  /* ---------- 判定 ---------- */
  .check-card {
    padding: 18px;
    border: 1px dashed rgba(155, 44, 36, 0.32);
    border-radius: 10px;
    background: rgba(255, 253, 247, 0.45);
  }
  .check-line {
    margin: 0;
    font-family: var(--serif);
    font-size: 16px;
    letter-spacing: 0.04em;
  }
  .check-hint { margin: 8px 0 16px; font-size: 12px; color: var(--muted); }
  .check-card .primary { width: 100%; margin-top: 2px; }

  /* ---------- 结算 ---------- */
  .result { padding-top: 22px; }
  .eyebrow {
    margin: 0 0 8px;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .result-title {
    margin: 0 0 14px;
    font-family: var(--serif);
    font-size: clamp(28px, 7.5vw, 38px);
    letter-spacing: 0.08em;
  }
  .result-text { margin-bottom: 18px; }
  .roll {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .muted { color: var(--muted); }

  .deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
  .delta {
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .delta.up { color: var(--green); background: rgba(47, 107, 79, 0.08); }
  .delta.down { color: var(--accent); background: rgba(155, 44, 36, 0.07); }

  .departure {
    margin: 0 0 14px;
    font-size: 11.5px;
    color: var(--gold);
    letter-spacing: 0.08em;
  }

  .history {
    margin: 6px 0 0;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .history summary { cursor: pointer; letter-spacing: 0.12em; color: var(--gold); }
  .history p { margin: 10px 0 0; font-family: var(--serif); line-height: 1.85; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .persona { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .persona select {
    border: 1px solid var(--line);
    background: rgba(255, 253, 247, 0.6);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 11px;
    color: var(--ink-2);
  }
  .hint {
    margin: 10px 0 0;
    font-size: 10.5px;
    color: rgba(128, 117, 103, 0.8);
    line-height: 1.7;
  }

  /* ---------- 终章 ---------- */
  .epilogue .act { color: var(--gold); }

  /* ---------- 结局 ---------- */
  .ending {
    min-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 36px 0 52px;
    animation: rise 0.4s ease both;
  }
  .ending-seal {
    width: 76px;
    height: 76px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: var(--accent);
    color: #fbeee0;
    font-family: var(--serif);
    font-size: 44px;
    box-shadow: inset 0 0 0 3px rgba(255, 245, 230, 0.16), 0 16px 40px rgba(155, 44, 36, 0.24);
  }
  .ending h1 { font-size: clamp(40px, 12vw, 58px); margin: 0; }
  .ending-sub {
    margin: 12px 0 0;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 0.08em;
  }
  .ending-text {
    max-width: 30em;
    margin: 26px auto 0;
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 2.05;
    letter-spacing: 0.02em;
    text-align: left;
    color: var(--ink);
  }
  .ending-comment {
    max-width: 30em;
    margin: 18px auto 0;
    font-family: var(--serif);
    font-size: 13px;
    line-height: 1.9;
    color: var(--muted);
    text-align: left;
  }
  .ending-stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 16px;
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .ending-stats b { color: var(--ink); font-weight: 600; }
  .all-done { margin: 18px 0 0; font-size: 11px; letter-spacing: 0.16em; color: var(--gold); }
  .ending-actions { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }

  /* ---------- 图鉴 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(32, 26, 20, 0.42);
    backdrop-filter: blur(6px);
    animation: fade 0.18s ease both;
  }
  .modal {
    width: min(100%, 720px);
    max-height: min(86vh, 900px);
    overflow: auto;
    padding: 22px;
    border: 1px solid rgba(74, 66, 56, 0.2);
    border-radius: 14px;
    background: var(--paper);
    box-shadow: var(--shadow);
    animation: rise 0.28s ease both;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: 30px;
    font-variant-numeric: tabular-nums;
  }
  .modal-head .close { font-size: 22px; line-height: 1; padding: 4px 10px; }
  .gallery { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

  .gallery-card {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255, 253, 247, 0.55);
    padding: 12px 14px;
  }
  .gallery-card.locked { opacity: 0.62; }
  .gallery-card summary {
    display: flex;
    align-items: baseline;
    gap: 12px;
    cursor: pointer;
    list-style: none;
  }
  .gallery-card summary::-webkit-details-marker { display: none; }
  .gallery-card.open summary::after {
    content: "▾";
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.14s ease;
  }
  .gallery-card.open[open] summary::after { transform: rotate(180deg); }
  .gallery-index {
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
    flex: 0 0 auto;
  }
  .gallery-title {
    font-family: var(--serif);
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--ink);
    flex: 0 0 auto;
  }
  .gallery-sub {
    font-family: var(--serif);
    font-size: 11.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gallery-hint { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .gallery-text {
    margin: 12px 0 0;
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--ink-2);
  }
  .gallery-comment { margin: 8px 0 0; font-size: 11px; color: var(--gold); }
  .modal-foot { margin: 16px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.7; }

  /* ---------- 动画 ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes stamp {
    from { opacity: 0; transform: scale(1.35) rotate(-4deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 540px) {
    #app { padding-left: 15px; padding-right: 15px; }
    .top { padding-bottom: 14px; }
    .hero { min-height: calc(100vh - 96px); padding-top: 20px; }
    .lede { font-size: 13px; }
    .scene { padding-top: 22px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .chip { padding: 4px 7px; font-size: 11px; justify-content: center; }
    .choice { padding: 14px 15px; }
    .ending-text { font-size: 14.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
